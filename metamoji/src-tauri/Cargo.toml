[package]
name = "metamoji"
version = "0.1.0"
description = "MetaMoJi-style handwriting note app for desktop"
authors = ["unischool"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "metamoji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "cookies", "rustls", "charset", "http2", "system-proxy", "multipart", "form"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26.5"
rustls = "0.23.43"
webpki-roots = "1.0.9"
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }

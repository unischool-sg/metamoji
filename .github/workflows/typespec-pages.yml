name: Deploy TypeSpec docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/typespec/**/*.tsp"
      - "docs/typespec/tspconfig.yaml"
      - "docs/typespec/package.json"
      - ".github/workflows/typespec-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/typespec
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeSpec
        run: npm run build

      - name: Generate HTML docs from OpenAPI spec
        run: |
          mkdir -p site
          npx --yes @redocly/cli build-docs \
            tsp-output/openapi/metamoji-classshare-openapi.yaml \
            -o site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/typespec/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
